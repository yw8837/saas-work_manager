# Supabase CLI 2.114.0 기준. 원격 프로젝트 ref는 config에 넣지 않고
# `npm run supabase:link -- --project-ref <ref>`로 로컬 .temp에만 저장한다.
project_id = "ilgamcheck"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[auth]
enabled = true
site_url = "https://ilgamcheck-beta.bsfire1237.chatgpt.site"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/reset",
  "http://localhost:3000/auth/reset",
  "https://ilgamcheck-beta.bsfire1237.chatgpt.site/auth/reset"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
